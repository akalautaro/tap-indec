[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tap-indec"
dynamic = ["version"]
description = "Tap de Meltano para ingerir series estadísticas del INDEC (Argentina)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Lautaro Celli", email = "cellilautaro@gmail.com" }]
keywords = ["meltano", "singer", "indec", "argentina", "etl", "datos-abiertos"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.32",
    "singer-sdk>=0.54,<0.55",
]

[project.optional-dependencies]
dev = [
    "jsonschema>=4.21",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "requests-mock>=1.12",
    "ruff>=0.6",
    "types-requests>=2.32",
]

[project.scripts]
tap-indec = "tap_indec.tap:TapIndec.cli"

[project.urls]
Homepage = "https://github.com/akalautaro/tap-indec"
Repository = "https://github.com/akalautaro/tap-indec"
Issues = "https://github.com/akalautaro/tap-indec/issues"
Changelog = "https://github.com/akalautaro/tap-indec/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "tap_indec/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["tap_indec"]

[tool.hatch.build.targets.sdist]
include = [
    "/tap_indec",
    "/tests",
    "/docs",
    "/CONTRIBUTING.md",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["tests/fixtures", "research"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["tap_indec"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
exclude = ["tests/fixtures"]

[[tool.mypy.overrides]]
module = ["singer_sdk.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config -m 'not integration'"
filterwarnings = ["error::DeprecationWarning:tap_indec.*"]
markers = [
    "integration: tests que pegan contra la API real de datos.gob.ar",
]

[tool.coverage.run]
source = ["tap_indec"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
